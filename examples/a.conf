# Secrets are environment variable names, never literal passwords.
# Only B initiates this link; A accepts it from loopback.
link b.local - 127.0.0.1 KELADIIRCD_NET_SECRET
oper admin 127.0.0.1 override KELADIIRCD_ADMIN_SECRET
# Optional: Anope services linking with its "ngircd" module.
# services services.local 127.0.0.1 KELADIIRCD_SERVICES_SECRET
