# Three linked KeladiIRCd servers and Anope. See docker/README.md.
#
#   beta ──┐
#          ├── alpha ── anope (services.irc.test)
#   cypher ┘
name: keladiircd

x-keladiircd: &keladiircd
  build:
    context: ..
    dockerfile: docker/keladiircd.Dockerfile
  image: keladiircd:local
  init: true # so Ctrl+C and `docker compose down` stop it at once
  restart: unless-stopped

services:
  alpha:
    <<: *keladiircd
    command: >-
      --name alpha.irc.test --description "alpha hub"
      --listen 0.0.0.0:6667 --link-listen 0.0.0.0:7000
      --config /etc/keladiircd.conf
    environment:
      BETA_LINK_SECRET: ${BETA_LINK_SECRET:?copy .env.example to .env}
      CYPHER_LINK_SECRET: ${CYPHER_LINK_SECRET:?copy .env.example to .env}
      SERVICES_SECRET: ${SERVICES_SECRET:?copy .env.example to .env}
      RPC_TOKEN: ${RPC_TOKEN:?copy .env.example to .env}
      ALPHA_OPER_SECRET: ${ALPHA_OPER_SECRET:?copy .env.example to .env}
    volumes:
      - ./alpha.conf:/etc/keladiircd.conf:ro
    ports:
      - 127.0.0.1:6667:6667
    networks:
      irc:
        ipv4_address: 172.30.0.10

  beta:
    <<: *keladiircd
    command: >-
      --name beta.irc.test --description "beta leaf"
      --listen 0.0.0.0:6667 --link-listen 0.0.0.0:7000
      --config /etc/keladiircd.conf
    environment:
      BETA_LINK_SECRET: ${BETA_LINK_SECRET:?copy .env.example to .env}
      RPC_TOKEN: ${RPC_TOKEN:?copy .env.example to .env}
      BETA_OPER_SECRET: ${BETA_OPER_SECRET:?copy .env.example to .env}
    volumes:
      - ./beta.conf:/etc/keladiircd.conf:ro
    ports:
      - 127.0.0.1:6668:6667
    networks:
      irc:
        ipv4_address: 172.30.0.11
    depends_on: [alpha]

  cypher:
    <<: *keladiircd
    command: >-
      --name cypher.irc.test --description "cypher leaf"
      --listen 0.0.0.0:6667 --link-listen 0.0.0.0:7000
      --config /etc/keladiircd.conf
    environment:
      CYPHER_LINK_SECRET: ${CYPHER_LINK_SECRET:?copy .env.example to .env}
      RPC_TOKEN: ${RPC_TOKEN:?copy .env.example to .env}
      CYPHER_OPER_SECRET: ${CYPHER_OPER_SECRET:?copy .env.example to .env}
    volumes:
      - ./cypher.conf:/etc/keladiircd.conf:ro
    ports:
      - 127.0.0.1:6669:6667
    networks:
      irc:
        ipv4_address: 172.30.0.12
    depends_on: [alpha]

  anope:
    build:
      context: ../tools/anope
      target: network
      args:
        UPLINK: 172.30.0.10
        SERVICES_NAME: services.irc.test
    image: keladiircd-anope:local
    restart: unless-stopped
    environment:
      SERVICES_SECRET: ${SERVICES_SECRET:?copy .env.example to .env}
      RPC_TOKEN: ${RPC_TOKEN:?copy .env.example to .env}
      SERVICES_ROOT: ${SERVICES_ROOT:-}
    volumes:
      - anope-data:/anope/data # NickServ/ChanServ registrations survive restarts
    networks:
      irc:
        ipv4_address: 172.30.0.20
    depends_on: [alpha]

networks:
  irc:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  anope-data:
