# alpha is the hub: beta, cypher and Anope all connect to it.
# Link rows take IP addresses, which is why compose.yaml gives every container a fixed one.
link beta.irc.test - 172.30.0.11 BETA_LINK_SECRET
link cypher.irc.test - 172.30.0.12 CYPHER_LINK_SECRET
services services.irc.test 172.30.0.20 SERVICES_SECRET
sasl 172.30.0.20:8080 /jsonrpc RPC_TOKEN
oper admin 172.30.0.1 override ALPHA_OPER_SECRET